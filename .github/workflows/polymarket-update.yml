name: Atualiza o retrato do Polymarket

on:
  schedule:
    - cron: "0,20,40 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/polymarket-update.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: polymarket-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Atualiza o snapshot a cada múltiplo de 20 minutos
        env:
          DEADLINE_UTC: "2026-10-26T06:00:00Z"
          LOOP_SECONDS: "20400"
          SLOT_SECONDS: "1200"
        run: |
          set -uo pipefail

          deadline="$(date -u -d "$DEADLINE_UTC" +%s)"
          started="$(date -u +%s)"
          loop_end=$((started + LOOP_SECONDS))
          if (( loop_end > deadline )); then
            loop_end="$deadline"
          fi
          if (( started >= deadline )); then
            echo "Prazo encerrado em $DEADLINE_UTC; nenhuma leitura será iniciada."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_attempt() {
            local attempt="$1"

            echo "Tentativa $attempt/3: sincroniza main, consulta Polymarket e publica o snapshot."
            if ! git pull --rebase origin main; then
              if [[ -d .git/rebase-apply || -d .git/rebase-merge ]]; then
                git rebase --abort || true
              fi
              echo "Falha em git pull --rebase."
              return 1
            fi

            if ! python scripts/update_polymarket.py; then
              echo "Falha na consulta ao Polymarket."
              return 1
            fi

            if ! git add -- polymarket.json; then
              echo "Falha ao preparar polymarket.json."
              return 1
            fi
            if ! git diff --cached --quiet -- polymarket.json; then
              if ! git commit -m "Atualiza dados do Polymarket"; then
                echo "Falha ao criar o commit do snapshot."
                return 1
              fi
            fi

            if git push origin HEAD:main; then
              return 0
            fi
            echo "Falha no push; haverá nova tentativa com pull --rebase."
            return 1
          }

          had_failure=0
          while true; do
            now="$(date -u +%s)"
            if (( now >= loop_end || now >= deadline )); then
              break
            fi

            cycle_ok=false
            for attempt in 1 2 3; do
              if run_attempt "$attempt"; then
                cycle_ok=true
                break
              fi
              if (( attempt < 3 )); then
                sleep 3
              fi
            done

            if [[ "$cycle_ok" != true ]]; then
              echo "As três tentativas falharam nesta janela; o próximo ciclo tentará novamente."
              had_failure=1
            fi

            now="$(date -u +%s)"
            if (( now >= loop_end || now >= deadline )); then
              break
            fi

            next_slot=$((((now / SLOT_SECONDS) + 1) * SLOT_SECONDS))
            wake_at="$next_slot"
            if (( wake_at > loop_end )); then
              wake_at="$loop_end"
            fi
            if (( wake_at > deadline )); then
              wake_at="$deadline"
            fi
            sleep_for=$((wake_at - now))
            if (( sleep_for > 0 )); then
              echo "Próxima leitura no próximo múltiplo de 20 minutos UTC; aguardando ${sleep_for}s."
              sleep "$sleep_for"
            fi
          done

          if (( had_failure != 0 )); then
            exit 1
          fi

      - name: Dispara a próxima execução até o prazo
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEADLINE_UTC: "2026-10-26T06:00:00Z"
        run: |
          set -euo pipefail

          deadline="$(date -u -d "$DEADLINE_UTC" +%s)"
          now="$(date -u +%s)"
          if (( now >= deadline )); then
            echo "Prazo encerrado em $DEADLINE_UTC; nenhuma nova execução será agendada."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/polymarket-update.yml/dispatches" \
            -d '{"ref":"main"}'
